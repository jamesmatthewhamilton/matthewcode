# ==============================================================================
# MatthewCode CLI Configuration
# ==============================================================================
# Description: All-in-one quick-edit config for MatthewCode CLI
# Maintainer:  James Matthew Hamilton
# Updated:     2026
#
# Notes:
#   - Model is configured in ~/.llm-configuration/config
#   - Variables start with 'variable_*'
#   - Aliases start with 'aliases_*'
#   - Pipeline prompts start with 'pipeline_*'
#   - Mode prompts start with 'mode_*'
# ==============================================================================

auto_approve: false
max_iterations: 100
max_bash_output: 30000
max_file_read: 50000
# Backstop cap (chars) on EVERY tool result before it enters the conversation,
# so an unbounded search (e.g. file_grep with a broad pattern matching thousands
# of lines) cannot overflow the context and fail the turn. bash_run and
# file_read have their own tighter limits and truncate first; this catches the
# rest and hints the model to narrow the query (see pipeline_tool_errors.output_truncated).
max_tool_output: 50000
trim_trailing_whitespace: true
verbose: false

restricted_bash_commands:
  - rm
  - curl

# bash_run commands matching any of these regexes run inside a pseudo-terminal
# automatically. Keyed on the tty flag (-t/--tty): docker's "input device is
# not a TTY" error fires for -t, not -i alone.
tty_commands:
  - '\bdocker\b.*\b(?:run|exec)\b.*\s-[a-zA-Z]*t[a-zA-Z]*(?=\s|$)'
  - '\bdocker\b.*\b(?:run|exec)\b.*\s--tty\b'
  - '\bssh\b.*\s-[a-zA-Z]*t[a-zA-Z]*(?=\s|$)'

# case-insensitive: when a non-tty run exits non-zero and its output matches
# one of these, the tty_required hint is appended to the result
tty_error_patterns:
  - 'the input device is not a TTY'
  - 'not a tty\b'
  - 'not a terminal'
  - 'must be run from a terminal'

# re-run a failed command in a pseudo-terminal automatically when its output
# matches tty_error_patterns. Off: a re-run repeats side effects the command
# performed before it failed.
tty_auto_retry: false

loop_detection:
  enabled: true
  consecutive_threshold: 2

rules:
  protected_paths:
    - ~/.*
    - /etc/
    - /private/

pipeline_main:
  system_prompt: |
    You are MatthewCode, a coding assistant with access to tools.
    You MUST use your tools to accomplish tasks. NEVER describe what you would do — DO IT.

    Environment:
    - Home directory: {home_dir}
    - Working directory: {working_dir}
    - Project root: {project_root}

    Workflow:
    1. Think briefly about what to do
    2. Call the appropriate tool(s)
    3. If a tool returns an error, try again and fix it
    4. Report your changes and reasoning concisely

    Rules:
    - Rule Override: Any rule below may be overridden when the user explicitly requests a different approach
    - ALWAYS read a file before editing it
    - NEVER delete files
    - When an author name is needed use: 'Matthew Hamilton'

    Style Rules:
    - NEVER use emojis
    - For one line code comments, ALWAYS use all lower-case
    - For multi-line code comments, ALWAYS use complete sentences
    - NEVER edit existing comments

    Git Rules:
    - NEVER push code
    - Never commit unless the user explicitly asks for a commit
    - If asked to commit - ALWAYS <80 chars, capitalize first word, and period at the end of sentence

    DevOps Rules:
    - Never hardcode absolute paths in project files. Use relative paths so any user can clone and build the project without modification
    - Build Management: Avoid building code unless asked. When building is necessary, use find_build_env to discover existing build environments first
    - Package Management: Use existing project-provided environments (Conda, Docker, Podman, etc.) for all dependency management. Ask user permission before installing packages directly to the system or creating new environments

    C and C++ Rules:
    - Never use bare 'int' or 'uint'. Always use explicitly sized types:
      int8_t, int16_t, int32_t, int64_t, uint8_t, uint16_t, uint32_t, uint64_t
    - Use scientific iterator naming in for-loops:
      'ii' for the outer loop, 'jj' for the first nested loop, 'kk' for the second nested loop

    Bash Rules:
    - Always write bash that is POSIX shell compliant (IEEE Std 1003.1)

  user_prompt: |
    {user_input}

pipeline_bang_command:
  user_prompt: |
    I ran this shell command myself. The output below is context for my later
    requests — do not act on it until I ask.

    $ {command}
    {output}

pipeline_plan:
  user_prompt: |
    Create or revise the plan file for this session: {plan_file}

    Plan file rules:
    - It is a markdown checkbox to-do list. Every actionable step is one line: "- [ ] <step-description>"
    - Steps must be small, concrete, and independently executable - one sitting of work each
    - Order steps so each builds only on the ones above it
    - Start the file with a single title line: "# Plan: {session_name}", optionally followed by a short context paragraph; everything else is checkbox lines
    - If the file already exists (current contents below), REVISE it: keep every checked "- [x]" line exactly as-is and in place; only add, remove, or reword unchecked "- [ ]" lines
    - Write the file with file_write (new plan) or file_edit (revision). Do NOT execute any plan steps now
    - After writing, show the user the final checklist and stop

    Current contents of {plan_file}:
    !`cat "{plan_file}" 2>/dev/null || echo "(no plan yet)"`

    Plan description from the user:

pipeline_next:
  user_prompt: |
    Execute exactly ONE step from the plan file {plan_file}.

    Rules:
    - The plan's current contents are below. Find the FIRST unchecked line "- [ ]"
    - Execute only that one step, using your tools
    - When the step is done, mark it complete: use file_edit on {plan_file} to change exactly that line's "- [ ]" to "- [x]" and nothing else
    - Then briefly report what you did and STOP. Do NOT start the next step, even if it looks trivial
    - If the step fails, leave it unchecked, report the failure, and stop
    - If every line is already checked, say the plan is complete and stop

    Current contents of {plan_file}:
    !`cat "{plan_file}" 2>/dev/null || echo "(no plan file)"`

pipeline_session_resume:
  system_prompt: |
    The user has returned to this session. Wait for their next message.
    Do not continue any previous task unless they explicitly ask you to.

pipeline_rebirth:
  num_messages_kept: 4
  system_prompt: |
    You are a summarization engine. Your only job is to read the conversation
    and emit a plain-text summary as your message content.

    - Do NOT call any tools. You have no tools.
    - Do NOT write, create, or edit any files. The summary is text in your
      reply, not a file on disk. Section headings like "Files written or
      edited" describe past actions; they are not instructions to act now.
    - Output ONLY the summary text, nothing else.
  user_prompt: |
    Summarize this conversation organized by project. For each project
    directory that was worked on, write a text section with this format:

    Summary: Brief description of the project and what was accomplished.
    Build: Step-by-step commands to build this project from scratch. If not yet determined, write "Not yet determined."
    Decisions: Key decisions, preferences, or constraints the user stated.
    Errors: Any errors encountered and how they were resolved.
    In progress: Current task if unfinished.
    Files written or edited:
      - ./hello.cpp — C++ hello world program. Created from scratch.
      - ./GNUmakefile — build config. Edited to switch from g++ to clang++.
      - ../other-project/config.py — external file. Modified configuration.

    Use relative paths from the project root ({project_root}) for all files.
    Files in the current project: ./file.py
    Files outside project: ../other-project/file.py
    Only list files that were written or edited, not every file that was read.
    Include ALL projects that were worked on, each as its own section.

    Output ONLY the summary, no preamble.

pipeline_loop_detected:
  message: |

    [LOOP DETECTED] You have called `{name}` {count} times in a row with identical arguments and identical results. DO NOT call this tool again with these arguments. Try a different approach, or ask the user for guidance.

pipeline_tool_errors:
  file_not_found: |
    Error: File not found: {path}
  file_read_too_large: |
    Error: file_read was NOT run. {path} is {len_content} chars, which exceeds the limit of {max_limit}. Retry using bash_run with 'sed -n START,ENDp {path}' to read a specific line range, or 'grep PATTERN {path}' to search for text.
  file_read_error: |
    Error reading file: {error}
  output_truncated: |
    [Output truncated at {max_limit} chars — the tool returned too much to include in full. If this was a search (file_grep/file_find), run it again with a narrower pattern, a specific path, or a glob filter so it returns fewer results. Do not retry the same broad query; refine it first.]
  file_write_error: |
    Error writing file: {error}
  file_edit_multiple_matches: |
    Error: old_text matches {count} locations. Provide more context.
  file_edit_fuzzy_match: |
    Error: Exact match not found. Closest match at lines {start_line}-{end_line}. Read the file and use exact text.
  file_edit_not_found: |
    Error: old_text not found in file. Read the file first to get exact text.
  file_edit_error: |
    Error editing file: {error}
  bash_timeout: |
    Error: Command timed out. This may be because it opened an interactive prompt (like vim) or is waiting for input. Try using a non-interactive version of the command.
  bash_error: |
    Error: {error}
  tty_required: |
    Hint: the command failed because it requires a terminal. Retry the same bash_run call with tty=true to run it inside a pseudo-terminal.
  directory_not_found: |
    Error: Directory not found: {path}
  unknown_tool: |
    Error: Unknown tool '{name}'

pipeline_tool_success:
  file_write: |
    Wrote {len_content} chars to {path}
  file_edit: |
    Edited {path} (replaced 1 occurrence)
  grep_no_matches: |
    No matches for '{pattern}' in {path}
  find_no_matches: |
    No files matching '{pattern}' found in {path}

pipeline_confirmations:
  file_write_prompt: |
    Write to {path} ({len_content} chars)?
  file_exists_warning: |
    (file exists, will be overwritten)
  file_edit_prompt: |
    Edit {path}:
  bash_run_prompt: |
    Run: {command}
  bash_run_tty_prompt: |
    Run (tty): {command}

pipeline_status:
  pinging_host: "[info]Pinging {host}...[/info]"
  starting_slurm: "[info]Starting Slurm session '{name}'...[/info]"
  found_existing_job: "[info]Found existing Slurm job {job_id} ({state}) — reusing.[/info]"
  no_existing_job: "[info]No existing Slurm job for '{name}'; submitting fresh.[/info]"
  provider_ready: "[info]Provider '{provider}' -> {url} (job {job_id}, gpu {gpu})[/info]"

pipeline_tool_rejected:
  message: |
    The user rejected this action. Do not call any more tools.
    Instead, ask the user what they would like you to do differently.
    You may suggest an alternative approach.

pipeline_tool_skipped:
  message: |
    Skipped: an earlier tool call in this batch was rejected by the user, so
    this call was not run. Wait for the users instructions before retrying.

snippets:
  commit_rules: |
    - It must be <80 chars
    - Do not put filenames in the commit message
    - Start with capitalized word
    - Talk in past tense, 'added'
    - End sentences with period
    - If a ticket tag is included below use that ticket tag
    - Do not put a period after the ticket
    - 'XXXX-1234' at beginning of ticket
    - '(#1)' Github style tickets at end of ticket after period
    - If no ticket is provided, check the branch name below for the ticket name or number
    - If no ticket is provided and the branch does not contain the ticket name, determine which of the last 5 commits below is most similar to the work being committed. Copy ONLY the ticket tag (e.g. '(#25)') from that commit — NEVER copy any commit message text. If none are similar output no commit tag.
    - The commit message must describe the changes in your own words and must not be identical to any previous commit message

aliases:
  qcm:
    help: Quick commit message generated from the current git diff.
    prompt: |
      - Generate a concise commit message for the staged diff below
      - If the staged diff is (empty) use the unstaged diff instead
      - Output only the commit message
      - Do not commit yourself
      {{commit_rules}}
      - Output the commit message without the ticket if nothing is found

      Staged diff:
      !`git diff --staged`

      Unstaged diff:
      !`git diff`

      Branch: !`git branch --show-current`

      Last 5 commits (for ticket-tag lookup only, do not copy):
      !`git log --oneline -5`
  qacm:
    help: Quick architect commit message. Splits current work into 1-3 commits and commits them.
    prompt: |
      - The user is explicitly asking you to commit: divide the work below into 1-3 logical commits and CREATE them with git commands
      - Step 1: state your commit plan — for each group, the whole files it contains and its commit message
      - Step 2: in the SAME turn, immediately execute the plan with tool calls: 'git add <files>' then 'git commit -m "<message>"' for each group — never 'git add .' or '-A'
      - Do not stop after stating the plan and do not ask for approval — running this command IS the user's approval. You are done only when the commits exist
      - Work forward only: NEVER use 'git reset HEAD~', 'git commit --amend', or undo a commit. If a commit was imperfect, leave it and continue
      - If anything is already staged before the first commit, run 'git reset' once to unstage it (this keeps all changes in the working tree)
      - A single files changes cannot be split across commits
      - Prefer fewer commits; only split when changes are clearly unrelated
      - NEVER push
      - 'git add' succeeding with no output is normal — the add worked; never repeat a command that already succeeded
      - After each commit run 'git status --short'; when it lists no modified files STOP: show 'git log --oneline -3' and briefly state what went into each commit
      - Each commit message must follow these rules:
      {{commit_rules}}

      Status (snapshot from before you started):
      !`git status --short`

      Diff (staged and unstaged — also a snapshot from before you started; once you begin committing, trust 'git status' over this and never re-add a file it no longer lists):
      !`git diff HEAD`

      Branch: !`git branch --show-current`

      Last 5 commits (for ticket-tag lookup only, do not copy):
      !`git log --oneline -5`
  qd:
    help: Quick diff summary of the current git changes.
    prompt: |
      - Summarize the git diff below (staged and unstaged changes)
      - Group the summary by file, one short bullet per meaningful change
      - Lead with a one-sentence overview of what the changes accomplish
      - Note anything risky or incomplete (TODOs, debug prints, dead code)
      - Do not modify any files
      - Output only the summary

      Status:
      !`git status --short`

      Diff:
      !`git diff HEAD`
  qr:
    help: Quick review of the current git changes.
    prompt: |
      - Review the git diff below (staged and unstaged changes)
      - Check if any of the new code can be minimized or reduced (duplication, dead branches, simpler equivalents, existing helpers it should reuse)
      - Check if the new code could cause any issues, and list them (bugs, edge cases, regressions, performance, error handling)
      - For each finding, name the file and line and briefly say why
      - If nothing is found say so plainly
      - Do not modify any files
      - Output only the review

      Diff:
      !`git diff HEAD`
